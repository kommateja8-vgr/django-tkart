

{% extends 'base.html' %}
{% load static %}

{% block content %}


<!-- ========================= MAIN BANNER ========================= -->
<section class="section-intro padding-y-sm">
    <div class="container">

        <div class="intro-banner-wrap">
            <img src="{% static 'images/banners/1.jpg' %}"
                 class="img-fluid rounded"
                 alt="GreatKart Shopping Banner">
        </div>

    </div>
</section>
<!-- ========================= MAIN BANNER END ========================= -->


<!-- ========================= POPULAR PRODUCTS ========================= -->
<section class="section-name padding-y-sm">
    <div class="container">

        <header class="section-heading">
            <a href="{% url 'store' %}" class="btn btn-outline-primary float-right">See all</a>
            <h3 class="section-title">Popular products</h3>
        </header>

        <div class="row">

            {% for product in products %}
            <!-- Product 1 -->
            <div class="col-md-3">
                
                <div class="card card-product-grid">
                    <a href="{{ product.get_url }}" class="img-wrap">
                        <img src="{{ product.images.url }}" alt="Product 1">
                    </a>
                    <figcaption class="info-wrap">
                        <a href="{{ product.get_url }}" class="title">{{ product.product_name }}</a>
                        <div class="price mt-1">{{ product.price}}</div>
                    </figcaption>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
<!-- ========================= POPULAR PRODUCTS END ========================= -->




{% endblock %}
